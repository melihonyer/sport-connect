version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sporlaconnect-db
    environment:
      POSTGRES_USER: sporla_user
      POSTGRES_PASSWORD: sporla_password_2024
      POSTGRES_DB: sporlaconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sporlaconnect-network
    restart: unless-stopped

  # Redis Cache (for sessions, rate limiting)
  redis:
    image: redis:7-alpine
    container_name: sporlaconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sporlaconnect-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sporlaconnect-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DB_USER: sporla_user
      DB_HOST: postgres
      DB_NAME: sporlaconnect
      DB_PASSWORD: sporla_password_2024
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - sporlaconnect-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sporlaconnect-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - sporlaconnect-network
    restart: unless-stopped

  # PgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sporlaconnect-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sporlaconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - sporlaconnect-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sporlaconnect-network:
    driver: bridge
