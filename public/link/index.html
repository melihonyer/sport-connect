    .stores { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    .meta { flex:1; min-width:0; }

    .chev { color:#cbd5e1; flex-shrink:0; }
    .ta { width:100%; margin-top:28px; border-radius:20px; background:var(--ta); padding:20px; position:relative; overflow:hidden; }
    .ta .dot { position:absolute; right:-36px; top:-36px; width:120px; height:120px; border-radius:50%; background:var(--ta-yellow); }
    .ta .line { position:relative; font-size:13px; font-weight:600; color:rgba(255,255,255,.8); }
    .ta img { position:relative; display:block; width:150px; height:auto; margin-top:10px; }
    .ta p { position:relative; margin-top:12px; font-size:17px; line-height:1.3; font-weight:700; max-width:19rem; }
    .ta a { position:relative; margin-top:16px; display:inline-flex; align-items:center; gap:8px; height:46px; padding:0 18px; border-radius:12px; background:#fff; color:var(--ta); font-weight:700; font-size:14.5px; text-decoration:none; }
    .social { width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .social a { display:flex; align-items:center; justify-content:center; height:52px; border-radius:14px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); color:#fff; text-decoration:none; font-weight:700; font-size:14.5px; }
    .social svg { width:20px; height:20px; }

    footer a { color:#fff; font-weight:700; text-decoration:none; }
    .store, .link, .ta a, .social a, .langs button { transition:transform .18s ease, background-color .18s ease, box-shadow .18s ease; }
    @media (hover:hover) and (pointer:fine) {

      .link:hover { transform:translateY(-1px); box-shadow:0 10px 22px -12px rgba(0,0,0,.45); }

      .social a:hover { background:rgba(255,255,255,.18); }
      .langs button:not([aria-pressed="true"]):hover { color:#fff; border-color:rgba(255,255,255,.5); }
      footer a:hover { text-decoration:underline; }
    }
    .link:active, .store:active, .social a:active { transform:scale(.99); }
    a:focus-visible, button:focus-visible { outline:3px solid var(--yellow); outline-offset:3px; }
