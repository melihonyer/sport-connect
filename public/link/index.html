      [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = L[el.getAttribute('data-t')] || ''; });
      var site = 'https://muuvlink.app';
      [].forEach.call(document.querySelectorAll('[data-page]'), function (a) {
        var p = a.getAttribute('data-page');
        var path = p === 'create' ? '/takim-kur' : L.paths[p];
        a.href = site + path + '?' + UTM;
      });
      document.getElementById('home-link').href = site + L.paths.home + '?' + UTM;
      document.getElementById('appstore').href = 'https://apps.apple.com/' + (lang === 'tr' ? 'tr/' : '') + 'app/muuvlink/id6781591672?ct=link-in-bio';
      document.getElementById('playstore').href = 'https://play.google.com/store/apps/details?id=app.muuvlink&hl=' + lang + '&referrer=' + encodeURIComponent(UTM);
      // Training Agents: telefonda doğrudan cihazın mağazası, masaüstünde site (tr/en).
      var ta = platform === 'ios' ? 'https://apps.apple.com/' + (lang === 'tr' ? 'tr/' : '') + 'app/id6808657949?ct=muuvlink-link'
        : platform === 'android' ? 'https://play.google.com/store/apps/details?id=com.trainingagentsapp.android&referrer=' + encodeURIComponent(TA_UTM)
        : 'https://trainingagentsapp.com' + (lang === 'tr' ? '/' : '/en/') + '?' + TA_UTM;
      document.getElementById('ta-cta').href = ta;
      [].forEach.call(document.querySelectorAll('#langs button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-l') === lang ? 'true' : 'false'); });
    }

    var box = document.getElementById('langs');
    CODES.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = c.toUpperCase(); b.setAttribute('data-l', c);
      b.addEventListener('click', function () {
        try { localStorage.setItem('muuvlang', c); } catch (e) {} // elle seçim: site de bu dilde açılır
        render(c);
      });
      box.appendChild(b);
    });
    render(pick());
  })();
  </script>
</body>
</html>
