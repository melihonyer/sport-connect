<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Muuvlink — Tüm Bağlantılar</title>
  <meta name="description" content="Muuvlink'i iOS ve Android'de indir, web'de keşfet, YouTube ve Instagram'da bizi takip et. Spor arkadaşını bul, takımını kur." />
  <meta name="theme-color" content="#00b7ba" />
  <link rel="canonical" href="https://muuvlink.app/link" />
  <link rel="apple-touch-icon" href="/icons/favicon.png" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://muuvlink.app/link" />
  <meta property="og:title" content="Muuvlink — Tüm Bağlantılar" />
  <meta property="og:description" content="Spor arkadaşını bul, takımını kur. iOS · Android · Web · YouTube · Instagram." />
  <meta property="og:image" content="https://muuvlink.app/og-image.jpg" />
  <meta property="og:site_name" content="Muuvlink" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts: Montserrat — uygulamayla aynı -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" /></noscript>

  <style>
    :root {
      --brand:        #00b7ba;
      --brand-dark:   #009295;
      --brand-darker: #017173;
      --ink:          #0f2b2c;
      --card:         #ffffff;
      --ring:         rgba(255,255,255,0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 50% -10%, #14c8cb 0%, var(--brand) 38%, var(--brand-dark) 72%, var(--brand-darker) 100%) fixed;
      position: relative;
      overflow-x: hidden;
      padding: max(env(safe-area-inset-top), 20px) 20px max(env(safe-area-inset-bottom), 28px);
    }

    /* Yumuşak animasyonlu ışık lekeleri (arka plan dokusu) */
    .glow { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.5; pointer-events: none; z-index: 0; }
    .glow.a { width: 340px; height: 340px; top: -120px; left: -100px; background: #4be3e5; animation: drift1 14s ease-in-out infinite; }
    .glow.b { width: 300px; height: 300px; bottom: -120px; right: -90px; background: #00d9c0; animation: drift2 16s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-40px); } }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      display: flex; flex-direction: column; align-items: center;
      animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Logo / kimlik */
    .badge {
      width: 92px; height: 92px; border-radius: 24px;
      background: #fff;
      display: grid; place-items: center;
      box-shadow: 0 18px 40px -14px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.4);
      margin-top: 12px;
    }
    .badge img { width: 66px; height: 66px; display: block; }

    .wordmark { height: 30px; margin-top: 22px; filter: brightness(0) invert(1); opacity: 0.98; }

    .tagline {
      margin-top: 12px; text-align: center;
      font-size: 16px; line-height: 1.5; font-weight: 500;
      color: rgba(255,255,255,0.92);
      max-width: 22rem;
    }

    /* Buton listesi */
    .links { width: 100%; margin-top: 30px; display: flex; flex-direction: column; gap: 13px; }

    .link {
      display: flex; align-items: center; gap: 15px;
      width: 100%; min-height: 62px; padding: 12px 18px;
      background: var(--card); color: var(--ink);
      border-radius: 18px; text-decoration: none;
      box-shadow: 0 10px 24px -14px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.6);
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
      opacity: 0; animation: pop .5s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .link:hover { background: #f6feff; box-shadow: 0 16px 30px -12px rgba(0,0,0,0.4); transform: translateY(-2px); }
    .link:active { transform: translateY(0) scale(0.99); }
    .link:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
    @keyframes pop { to { opacity: 1; transform: none; } }
    .link:nth-child(1){ animation-delay:.08s } .link:nth-child(2){ animation-delay:.15s }
    .link:nth-child(3){ animation-delay:.22s } .link:nth-child(4){ animation-delay:.29s }
    .link:nth-child(5){ animation-delay:.36s }

    .ico { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; }
    .ico svg { width: 24px; height: 24px; display: block; }
    .ico.apple { background: #000; }
    .ico.play  { background: #f1f5f9; }
    .ico.web   { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); }
    .ico.yt    { background: #ff0000; }
    .ico.ig    { background: linear-gradient(45deg,#feda75,#fa7e1e 28%,#d62976 58%,#962fbf 78%,#4f5bd5); }

    .meta { flex: 1; min-width: 0; }
    .meta .t { display: block; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.15; letter-spacing: -0.2px; }
    .meta .s { display: block; font-size: 13px; color: #64748b; font-weight: 500; margin-top: 2px; }
    .chev { color: #cbd5e1; flex-shrink: 0; }
    .link:hover .chev { color: var(--brand-dark); }

    footer { margin-top: 30px; text-align: center; color: rgba(255,255,255,0.85); font-size: 13px; line-height: 1.6; }
    footer a { color: #fff; text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      *, .glow, .wrap, .link { animation: none !important; transition: none !important; }
      .link { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
