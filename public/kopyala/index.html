<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#114956" />
  <title>Muuvlink</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" />
  <!--
    E-postalardaki "Linki kopyala" butonu buraya gelir: e-posta programları
    panoya yazmaya izin vermiyor. ?u= yalnız muuvlink.app adresi olabilir
    (başka bir adres gelirse ana sayfa kullanılır), ?l= dil kodu.
    Uygulaması kurulu telefonda bu adres uygulamada açılır; appUrlOpen
    (sporla-bulusma.jsx) /kopyala/ gördüğünde bu sayfayı yükler.
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #F4F4F4; color: #1F2121;
      font-family: 'Montserrat', -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 440px; background: #fff; border-radius: 20px;
      padding: 32px 24px 28px; box-shadow: 0 4px 24px rgba(17,73,86,.08); text-align: center; }
    .logo { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 20px; color: #114956; }
    .url { background: #F4F4F4; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px;
      font-size: 15px; color: #114956; word-break: break-all; user-select: all; -webkit-user-select: all; }
    button, a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      font: inherit; font-size: 16px; font-weight: 700; border-radius: 12px; padding: 15px 18px;
      cursor: pointer; text-decoration: none; margin-top: 12px; }
    button { background: #F4F818; color: #114956; border: 0; }
    button.done { background: #114956; color: #fff; }
    a.btn { background: #fff; color: #114956; border: 1.5px solid #114956; }
    .hint { font-size: 13px; color: #64748b; margin: 14px 0 0; min-height: 1.4em; }
    svg { width: 20px; height: 20px; flex: none; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/favicon.png" alt="Muuvlink" />
    <h1 id="title"></h1>
    <div class="url" id="url"></div>
    <button id="copy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span id="copyLabel"></span>
    </button>
    <p class="hint" id="hint"></p>
    <a class="btn" id="open"></a>
  </main>
  <script>
    (function () {
      var T = {
        tr: { title: 'Paylaşım linkin', copy: 'Linki kopyala', done: 'Kopyalandı', hint: "Şimdi WhatsApp'a ya da istediğin yere yapıştırabilirsin.", fail: 'Kopyalanamadı. Linke uzun basıp kopyala.', open: "Muuvlink'te aç" },
        en: { title: 'Your share link', copy: 'Copy link', done: 'Copied', hint: 'Now paste it into WhatsApp or anywhere you like.', fail: "Couldn't copy. Long-press the link to copy it.", open: 'Open in Muuvlink' },
        de: { title: 'Dein Teilen-Link', copy: 'Link kopieren', done: 'Kopiert', hint: 'Jetzt in WhatsApp oder wo du willst einfügen.', fail: 'Kopieren fehlgeschlagen. Halte den Link gedrückt, um ihn zu kopieren.', open: 'In Muuvlink öffnen' },
        el: { title: 'Ο σύνδεσμός σου', copy: 'Αντιγραφή συνδέσμου', done: 'Αντιγράφηκε', hint: 'Τώρα κάνε επικόλληση στο WhatsApp ή όπου θέλεις.', fail: 'Η αντιγραφή απέτυχε. Πάτα παρατεταμένα τον σύνδεσμο για αντιγραφή.', open: 'Άνοιγμα στο Muuvlink' },
        es: { title: 'Tu enlace para compartir', copy: 'Copiar enlace', done: 'Copiado', hint: 'Ahora pégalo en WhatsApp o donde quieras.', fail: 'No se pudo copiar. Mantén pulsado el enlace para copiarlo.', open: 'Abrir en Muuvlink' },
        fr: { title: 'Ton lien de partage', copy: 'Copier le lien', done: 'Copié', hint: 'Colle-le maintenant dans WhatsApp ou où tu veux.', fail: 'Impossible de copier. Appuie longuement sur le lien pour le copier.', open: 'Ouvrir dans Muuvlink' },
        it: { title: 'Il tuo link da condividere', copy: 'Copia link', done: 'Copiato', hint: 'Ora incollalo su WhatsApp o dove vuoi.', fail: 'Copia non riuscita. Tieni premuto il link per copiarlo.', open: 'Apri in Muuvlink' }
      };
      var q = new URLSearchParams(location.search);
      var lang = T[q.get('l')] ? q.get('l') : 'tr';
      var L = T[lang];
      var u = q.get('u') || '';
      if (u.indexOf('https://muuvlink.app/') !== 0) u = 'https://muuvlink.app/';
      document.documentElement.lang = lang;
      var $ = function (id) { return document.getElementById(id); };
      $('title').textContent = L.title;
      $('url').textContent = u;
      $('copyLabel').textContent = L.copy;
      $('open').textContent = L.open;
      $('open').href = u;

      function legacyCopy() {
        var ta = document.createElement('textarea');
        ta.value = u; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, u.length);
        var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }
      function copied() {
        $('copy').classList.add('done');
        $('copyLabel').textContent = L.done + ' ✓';
        $('hint').textContent = L.hint;
      }
      function copy(silent) {
        var fallback = function () {
          if (legacyCopy()) copied();
          else if (!silent) $('hint').textContent = L.fail;
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(copied, silent ? function () {} : fallback);
        } else if (!silent) fallback();
      }
      $('copy').addEventListener('click', function () { copy(false); });
      // Bazı tarayıcılar dokunuş olmadan da izin veriyor: denemek zararsız,
      // olmazsa buton bekler.
      copy(true);
    })();
  </script>
</body>
</html>
