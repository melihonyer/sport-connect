<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- iOS Smart App Banner: kurulu→AÇ, değil→İNDİR (Apple otomatik yönetir) -->
  <meta name="apple-itunes-app" content="app-id=6781591672">
  <script>
    // Native uygulamada (Capacitor) input focus sonrası iOS'un zoom'da kalmasını önle.
    // Web'de pinch-zoom erişilebilirlik için açık bırakılır.
    (function() {
      if (new URLSearchParams(window.location.search).get('src') === 'app') {
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
      }
    })();
  </script>

  <!-- Primary meta -->
  <title>Muuvlink — Spor Arkadaşı Bul, Takım Kur</title>
  <meta name="description" content="Çevrende spor yapan insanları bul, kendi takımını kur, etkinlikler planla. GPS ile en yakın etkinlikleri saniyeler içinde keşfet.">
  <meta name="keywords" content="spor, etkinlik, takım, sporcu, fitness, futbol, basketbol, tenis, koşu, muuvlink">
  <meta name="author" content="Muuvlink">
  <meta name="robots" content="index, follow">
  <!-- Canonical: statik varsayılan (ana sayfa) — Googlebot ilk taramada bile görür -->
  <link rel="canonical" href="https://muuvlink.app/">
  <!-- Alt sayfalarda canonical'ı path'e göre güncelle -->
  <script>
    (function(){
      if (window.location.pathname !== '/') {
        var l = document.querySelector('link[rel="canonical"]');
        if (l) l.href = 'https://muuvlink.app' + window.location.pathname;
      }
    })();
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://muuvlink.app/">
  <meta property="og:title" content="Muuvlink — Spor Arkadaşı Bul">
  <meta property="og:description" content="Çevrende spor yapan insanları bul, kendi takımını kur, etkinlikler planla. GPS ile en yakın etkinlikleri saniyeler içinde keşfet.">
  <meta property="og:image" content="https://muuvlink.app/og-image.jpg">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="Muuvlink">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://muuvlink.app/">
  <meta name="twitter:title" content="Muuvlink — Spor Arkadaşı Bul">
  <meta name="twitter:description" content="Çevrende spor yapan insanları bul, kendi takımını kur, etkinlikler planla.">
  <meta name="twitter:image" content="https://muuvlink.app/og-image.jpg">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00b7ba">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muuvlink">
  <link rel="apple-touch-icon" href="/icons/favicon.png">

  <!-- Favicon – ICO for auto-discovery, PNG for modern browsers -->
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon.png">

  <!-- Fonts: Montserrat (tüm site — gövde + başlık, ağırlıkla ayrışır) -->
  <!-- preconnect: DNS + TLS handshake önceden yap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking async font load: render'ı bloklamaz, FOUT yerine swap kullanır -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </noscript>

  <style>
    *, *::before, *::after { font-family: 'Montserrat', sans-serif; }
  </style>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Muuvlink",
    "url": "https://muuvlink.app",
    "description": "Çevrende spor yapan insanları bul, kendi takımını kur, etkinlikler planla. GPS ile en yakın etkinlikleri saniyeler içinde keşfet.",
    "applicationCategory": "SportsApplication",
    "operatingSystem": "Web",
    "inLanguage": "tr",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "TRY"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Muuvlink",
      "url": "https://muuvlink.app"
    },
    "featureList": [
      "Spor arkadaşı bul",
      "Etkinlik planla",
      "Takım kur",
      "GPS ile etkinlik keşfet"
    ]
  }
  </script>
</head>
<body>
  <!-- Native splash bridge: shows teal overlay until React is ready, removed immediately on web -->
  <div id="native-loader" style="position:fixed;inset:0;z-index:99999;background:#00b7ba;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 0.25s ease">
    <img src="/icons/logo-yatay.svg" alt="Muuvlink" style="height:28px;width:auto;filter:brightness(0) invert(1);opacity:0.9">
  </div>
  <script>
    // Remove overlay immediately if not a Capacitor native app
    (function() {
      var isNativeApp = window?.Capacitor?.isNativePlatform?.() === true ||
                        new URLSearchParams(window.location.search).get('src') === 'app';
      if (!isNativeApp) {
        var el = document.getElementById('native-loader');
        if (el) el.remove();
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
