##
## AKTİF DOSYA: /etc/nginx/sites-enabled/muuvlink  (symlink DEĞİL, ayrı gerçek dosya!)
## sites-available/muuvlink diverge olmuş ve YÜKLENMİYOR — düzenlemeleri sites-enabled'a uygula.
## Repodaki nginx.conf bu dosyanın BİREBİR kopyasıdır: sunucuda değiştirirsen repoya da yaz.
## Deploy: scp → /tmp, cp → /etc/nginx/sites-enabled/muuvlink, `nginx -t` && `systemctl reload nginx`
##

# ── Bot prerender yönlendirmesi ───────────────────────────────────────
# İki grup bot JS çalıştırmaz:
#   1) Sosyal/preview botları (WhatsApp, facebookexternalhit...) → OG kartı
#   2) Yapay zeka motorları (GPTBot, OAI-SearchBot, PerplexityBot, ClaudeBot)
#      → sayfanın gerçek metni; aksi halde boş bir SPA kabuğu okuyorlar.
#   3) VibeToGeoBot (VIBE TO GEO site denetimi) → yapay zeka botlarının gördüğünü
#      görsün; yoksa her adreste ana sayfayı görüp sayfaları kopya sayıyor.
# Bu botlar backend'e düşer, insanlar statik index.html'i nginx'ten alır.
# Backend aynı içeriği basar (cloaking yok); bkz. backend-api.js SEO bölümleri.
map $http_user_agent $muuv_og_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|vkShare|SkypeUriPreview|Embedly|Iframely|Googlebot|bingbot|Google-InspectionTool|GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-SearchBot|Claude-User|PerplexityBot|Perplexity-User|Amazonbot|DuckDuckBot|YandexBot|meta-externalagent|VibeToGeoBot)" 1;
}

# HTTP → HTTPS (www ve www'suz)
server {
    listen 80;
    server_name muuvlink.app www.muuvlink.app;
    return 301 https://muuvlink.app$request_uri;
}

# www → www'suz 301 redirect
server {
    listen 443 ssl http2;
    server_name www.muuvlink.app;

    ssl_certificate     /etc/letsencrypt/live/muuvlink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muuvlink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://muuvlink.app$request_uri;
}

# Ana server block (www'suz)
server {
    listen 443 ssl http2;
    server_name muuvlink.app;

    # Threshold İzleme: tek sayfalık uygulamanın sayfa geçişi bildirimi
    # (sendBeacon /_thr/page/<yol>). Uygulamaya gitmez; nginx 204 ile yanıtlar
    # ve yalnız Threshold loguna yazar (conf.d/threshold-traffic.conf).
    location ^~ /_thr/ {
        access_log /var/log/nginx/threshold-traffic.log threshold;
        return 204;
    }

    # SSL — Certbot bu satırları otomatik yönetir
    ssl_certificate     /etc/letsencrypt/live/muuvlink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muuvlink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/muuvlink/dist;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self)" always;

    # ── Zafiyet tarayıcıları: olmayan dosyalara site iskeleti yerine 404 ──
    # Site PHP/WordPress değil; bu yollar SPA'ya düşüp 200 dönüyordu (zararsız
    # ama botların raporunda "var" görünüyordu). /.well-known HARİÇ: iOS/Android
    # uygulama bağlantı dosyaları orada. Regex'ler aşağıdakilerden ÖNCE durmalı.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.php$ {
        return 404;
    }
    location ~* ^/(?:wp-admin|wp-includes|wp-content|wp-login|wp-json|xmlrpc|phpmyadmin|cgi-bin)(?:/|$|\.) {
        return 404;
    }

    # ── Cache-Control ─────────────────────────────────────────────────
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Logo/icon dosyaları sık güncellenebilir — 1 gün cache
    location ~* ^/icons/.*\.(?:svg|png|ico)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Diğer görseller ve fontlar — 1 yıl immutable
    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache";
        access_log off;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API proxy ─────────────────────────────────────────────────────
    location /api/ {
        client_max_body_size 20m;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    # ── Detay sayfaları: OG/preview botları backend'den OG-enjekte HTML alır,
    #    insanlar normal SPA'yı alır. ──
    location ~ ^/(takim|etkinlik)/ {
        add_header Cache-Control "no-store" always;
        if ($muuv_og_bot) {
            proxy_pass http://127.0.0.1:3000;
        }
        try_files $uri /index.html;
    }

    # ── Liste sayfaları: botlar backend'den gerçek metni (yaklaşan etkinlikler,
    #    herkese açık takımlar) alır, insanlar normal SPA'yı alır.
    #    /en/, /de/, /el/, /es/, /fr/ ve /it/ önekli karşılıkları da buradan geçer; Türkçe ANA SAYFA
    #    bilerek yok — o statik index.html'den gelir, Node yolun dışında kalsın. ──
    location ~ ^/(antrenmanlar|etkinlikler|takimlar|iletisim|en|de|el|es|fr|en/events|en/teams|en/contact|de/events|de/teams|de/kontakt|el/events|el/teams|el/contact|es/eventos|es/equipos|es/contacto|fr/evenements|fr/equipes|fr/contact|it|it/eventi|it/squadre|it/contatti|rehber|en/guide|de/anleitung|el/guide|es/guia|fr/guide|it/guida)$ {
        add_header Cache-Control "no-store" always;
        if ($muuv_og_bot) {
            proxy_pass http://127.0.0.1:3000;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
