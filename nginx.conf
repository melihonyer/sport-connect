##
## AKTİF DOSYA: /etc/nginx/sites-enabled/muuvlink  (symlink DEĞİL, ayrı gerçek dosya!)
## sites-available/muuvlink diverge olmuş ve YÜKLENMİYOR — düzenlemeleri sites-enabled'a uygula.
## Deploy: scp → /tmp, cp → /etc/nginx/sites-enabled/muuvlink, `nginx -t` && `systemctl reload nginx`
##

# ── Sosyal/preview botları için OG prerender yönlendirmesi ────────────
# facebookexternalhit, WhatsApp, Twitterbot... JS çalıştırmaz; detay sayfalarında
# per-sayfa OG etiketlerini backend'den alsınlar. İnsanlar normal SPA'yı alır.
map $http_user_agent $muuv_og_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|vkShare|SkypeUriPreview|Embedly|Iframely|Googlebot|bingbot|Google-InspectionTool)" 1;
}

# HTTP → HTTPS (www ve www'suz)
server {
    listen 80;
    server_name muuvlink.app www.muuvlink.app;
    return 301 https://muuvlink.app$request_uri;
}

# www → www'suz 301 redirect
server {
    listen 443 ssl http2;
    server_name www.muuvlink.app;

    ssl_certificate     /etc/letsencrypt/live/muuvlink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muuvlink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://muuvlink.app$request_uri;
}

# Ana server block (www'suz)
server {
    listen 443 ssl http2;
    server_name muuvlink.app;

    # SSL — Certbot bu satırları otomatik yönetir
    ssl_certificate     /etc/letsencrypt/live/muuvlink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muuvlink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/muuvlink/dist;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self)" always;

    # ── Cache-Control ─────────────────────────────────────────────────
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Logo/icon dosyaları sık güncellenebilir — 1 gün cache
    location ~* ^/icons/.*\.(?:svg|png|ico)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Diğer görseller ve fontlar — 1 yıl immutable
    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache";
        access_log off;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API proxy ─────────────────────────────────────────────────────
    location /api/ {
        client_max_body_size 20m;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    # ── Detay sayfaları: OG/preview botları backend'den OG-enjekte HTML alır,
    #    insanlar normal SPA'yı alır. ──
    location ~ ^/(takim|etkinlik)/ {
        add_header Cache-Control "no-store" always;
        if ($muuv_og_bot) {
            proxy_pass http://127.0.0.1:3000;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
