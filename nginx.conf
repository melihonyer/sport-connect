##
## /etc/nginx/sites-available/muuvlink
## Sunucuya kopyala: sudo cp nginx.conf /etc/nginx/sites-available/muuvlink
##

server {
    listen 80;
    server_name muuvlink.app www.muuvlink.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name muuvlink.app www.muuvlink.app;

    # SSL — Certbot bu satırları otomatik yönetir
    # ssl_certificate     /etc/letsencrypt/live/muuvlink.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/muuvlink.app/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/muuvlink/dist;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self)" always;

    # ── Cache-Control ─────────────────────────────────────────────────
    # Hashed assets (JS/CSS) — forever
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fonts & images — 1 year
    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Sitemap & robots — 1 day
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Service worker — no cache (always fresh)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache";
        access_log off;
    }

    # Manifest — short cache
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ── API proxy to Node backend ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # SSE support
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # Uploads served directly
    location /uploads/ {
        alias /var/www/muuvlink/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── SPA fallback — tüm rotalar index.html'e yönlendirilir ────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
